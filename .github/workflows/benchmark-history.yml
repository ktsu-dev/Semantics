name: Benchmark History

# Measures a small, fixed set of benchmarks once per release, appends the numbers to a committed
# history file, and redraws the chart the README shows.
#
# Two ways in:
#   * a CI run on main that published a release, which measures that version and adds one point;
#   * a manual dispatch listing versions, which measures each of them in ONE job and backfills.
#
# Why not `release: published`: the shared pipeline publishes releases with GITHUB_TOKEN, and an
# event caused by GITHUB_TOKEN starts no workflow run, so that trigger never fired once (#320).
# `workflow_run` on CI does fire, because the CI run itself was started by the push to main. The
# resolve job then asks whether that run published a release, and which one.
#
# A backfill version is measured as a published package, through BenchmarkAgainstVersion: no tag
# before this workflow carries a benchmark project, so there is no older source to run. A release
# from now on does carry one, and is measured from its own tag through a worktree -- which is also
# what keeps the release path off a race, since the package for a tag is not necessarily on
# nuget.org yet at the moment its release is published.
#
# The backfill running as a single job still matters: separate runs land on different CI hosts,
# and that difference is larger than most releases are. Within one job the points are comparable
# as they stand; across jobs, BaselineBenchmarks is what ties them together.
#
# Three subjects share one job: quantities, strings, and paths. One job rather than a matrix so
# that the reference workload is measured once and stamped on every entry the run produces -- which
# is what lets a strings point and a quantities point from the same run be compared at all. It also
# keeps the results to a single push.
#
# That applies from the first run of this workflow onward. The histories committed before it carry
# baselines from two different machines, so the three charts' time rows are not yet on one scale.
#
# The cost is wall clock, and `subjects` on the dispatch is the answer to that: a long backfill is
# split by subject across runs rather than by raising the timeout.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated released versions of ktsu.Semantics.Quantities to backfill, oldest first"
        required: false
        default: "3.3.1 4.0.0 4.1.0 4.2.0 4.3.2 5.0.0 5.1.0 5.2.0 5.2.4 5.3.2"
        type: string
      subjects:
        description: "Space-separated subjects to measure: quantities strings paths"
        required: false
        default: "quantities strings paths"
        type: string

# Read-only by default. Only the measure job, which pushes the results, asks for write.
permissions:
  contents: read

concurrency:
  group: benchmark-history
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0"
  # Already ignored, and ktsu.Sdk regenerates .gitignore on build so a new entry would not last.
  RUNS: BenchmarkDotNet.Artifacts
  # Short runs: three iterations is enough for a trend line, and a release should not tie up a
  # runner for half an hour.
  BENCHMARK_JOB: short
  # One line per chart: name|history|chart|filter. An environment variable cannot hold an array,
  # and three steps need the same three triples, so this is the one place they are written.
  #
  # The quantities filter names one operation per panel. The strings and paths filters name whole
  # classes instead, so they measure more than they draw: ingest stores every row and only render
  # selects, which lets a panel be promoted later without re-running any history. Do not prune these
  # to match the panel count.
  # What varies between subjects is the axis: a quantity is a value type over T and does almost
  # nothing of its own, so its release changes land per storage type; a semantic string spends its
  # cost at creation, so its axis is how much validation the type declares.
  SUBJECTS: |
    quantities|docs/benchmarks/history.json|docs/benchmarks/performance.svg|*ConstructionBenchmarks*FromNauticalMile *UnitConversionBenchmarks*InNauticalMile *OperatorBenchmarks*LengthTimesLength *VectorBenchmarks*.Length *ComparisonBenchmarks*CompareToInterface *AbstractionCostBenchmarks*
    strings|docs/benchmarks/strings-history.json|docs/benchmarks/strings-performance.svg|*StringCreationBenchmarks* *StringOperationBenchmarks*
    paths|docs/benchmarks/paths-history.json|docs/benchmarks/paths-performance.svg|*PathCreationBenchmarks* *PathOperationBenchmarks*

jobs:
  # A CI run on main finishes whether or not it released anything: the version gate skips a
  # release for commits that change nothing shipped. This job names the release the run
  # published, or nothing, and the measure job runs only when there is something to measure.
  resolve:
    name: Find the release
    # Only a CI run of this repository's own code: a pull request from a fork whose branch is
    # also called main would otherwise match the branches filter. Nothing here checks out the
    # triggering run's code either way; a workflow_run job checks out the default branch.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Find the release this CI run published
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          release=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName,publishedAt --jq '.[0] // empty')
          if [ -z "$release" ]; then
            echo "No published release; nothing to measure."
            exit 0
          fi
          tag=$(jq -r '.tagName' <<< "$release")
          published=$(jq -r '.publishedAt' <<< "$release")

          # ISO-8601 UTC timestamps in one format compare correctly as strings. A release
          # published before this run started came from an earlier run.
          if [[ "$published" < "$RUN_STARTED" ]]; then
            echo "Latest release $tag ($published) predates this run ($RUN_STARTED); nothing to measure."
            exit 0
          fi

          # A rerun of the CI run, or a dispatch that already backfilled the version, must not
          # add a second point for it.
          version="${tag#v}"
          if jq -e --arg v "$version" '.entries | any(.version == $v)' docs/benchmarks/history.json >/dev/null; then
            echo "$version is already in the history; nothing to measure."
            exit 0
          fi

          echo "CI run published $tag; measuring it."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  measure:
    name: Measure and chart
    needs: resolve
    # `always()` because resolve is skipped on a dispatch, and a skipped need otherwise skips this.
    # Only on the default branch, since the results are pushed there. A workflow_run job always
    # runs there; a dispatch runs on whatever branch it was started from.
    if: >-
      always()
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'workflow_dispatch' || needs.resolve.outputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Three subjects rather than one. The dispatch's `subjects` input is the intended way to split
    # a long backfill across runs; raising this number further is not.
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # No ref: the default branch, which the job's condition guarantees, not the released
          # tag. The results are committed back here, and checking out the tag would leave the
          # checkout detached at it, so the push at the end would ask the branch to move backwards.
          fetch-depth: 0

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}.x

      # Measured from this checkout, and stamped onto every entry this job produces: everything
      # here shares one runner, so one reading of that runner describes all of it.
      - name: Measure the reference workload
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project Semantics.Benchmarks -- \
            --filter '*BaselineBenchmarks.ReferenceWork' \
            --job "$BENCHMARK_JOB" \
            --artifacts "$GITHUB_WORKSPACE/$RUNS/baseline"
          ns=$(dotnet run scripts/benchmark-history.cs -- baseline --results "$RUNS/baseline")
          echo "Reference workload: $ns ns"
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      - name: Measure the released version
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          work="${RUNNER_TEMP}/bench-$version"
          git worktree add --detach "$work" "$TAG"

          # Every command in these loops inherits the here-string as stdin. A process that drains it
          # would truncate the loop to one iteration and still exit zero, silently dropping subjects,
          # so each invocation reads from /dev/null instead. BenchmarkDotNet does prompt when a
          # filter selects nothing, which the backfill treats as an ordinary skip.
          while IFS='|' read -r subject history chart filter; do
            [ -n "$subject" ] || continue
            echo "::group::$subject $version"
            (cd "$work" && dotnet run -c Release --project Semantics.Benchmarks -- \
              --filter $filter \
              --job "$BENCHMARK_JOB" \
              --artifacts "$GITHUB_WORKSPACE/$RUNS/$subject/$version" </dev/null)

            dotnet run scripts/benchmark-history.cs -- ingest \
              --history "$history" \
              --results "$RUNS/$subject/$version" \
              --version "$version" \
              --commit "$(git rev-parse --short "$TAG^{commit}")" \
              --date "$(git log -1 --format=%cs "$TAG")" \
              --run-id "${{ github.run_id }}" \
              --baseline-ns "${{ steps.baseline.outputs.ns }}" </dev/null
            echo "::endgroup::"
          done <<< "$SUBJECTS"

          git worktree remove --force "$work"

      - name: Measure each backfill version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
          SUBJECTS_WANTED: ${{ inputs.subjects }}
          BASELINE_NS: ${{ steps.baseline.outputs.ns }}
        run: |
          set -euo pipefail
          read -ra versions <<< "$VERSIONS"
          read -ra wanted <<< "$SUBJECTS_WANTED"

          for version in "${versions[@]}"; do
            while IFS='|' read -r subject history chart filter; do
              [ -n "$subject" ] || continue
              # Skip a subject the dispatch did not ask for.
              case " ${wanted[*]} " in *" $subject "*) ;; *) continue ;; esac

              echo "::group::$subject $version"
              # Through the environment rather than a -p: switch, because BenchmarkDotNet generates
              # and builds a project of its own per run, which a property passed on the command line
              # does not reach. MSBuild reads environment variables as properties in every project.
              if ! BenchmarkAgainstVersion="$version" dotnet run -c Release --project Semantics.Benchmarks -- \
                   --filter $filter \
                   --job "$BENCHMARK_JOB" \
                   --artifacts "$GITHUB_WORKSPACE/$RUNS/$subject/$version" </dev/null; then
                echo "::warning::$subject $version could not be benchmarked by the current suite; skipping"
                echo "::endgroup::"
                continue
              fi

              tag="v$version"
              commit=""
              date=""
              if git rev-parse -q --verify "$tag^{commit}" >/dev/null; then
                commit="$(git rev-parse --short "$tag^{commit}")"
                date="$(git log -1 --format=%cs "$tag")"
              fi

              # Skipped here too: a package can build against these benchmarks and still throw from
              # every one of them at run time, which BenchmarkDotNet reports as a table of NA rather
              # than as a failure. Ingest refuses such a run, and the backfill carries on.
              if ! dotnet run scripts/benchmark-history.cs -- ingest \
                   --history "$history" \
                   --results "$RUNS/$subject/$version" \
                   --version "$version" \
                   --commit "$commit" \
                   --date "$date" \
                   --run-id "${{ github.run_id }}" \
                   --baseline-ns "$BASELINE_NS" </dev/null; then
                echo "::warning::$subject $version produced no usable measurement; skipping"
              fi
              echo "::endgroup::"
            done <<< "$SUBJECTS"
          done

      - name: Redraw the charts
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r subject history chart filter; do
            [ -n "$subject" ] || continue
            if [ ! -f "$history" ]; then
              echo "No history for $subject yet; nothing to draw."
              continue
            fi
            dotnet run scripts/benchmark-history.cs -- render \
              --subject "$subject" --history "$history" --out "$chart" </dev/null
          done <<< "$SUBJECTS"

      - name: Commit the history and the chart
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first, then compared against the index: on the first run these files are new,
          # and `git diff` alone does not see an untracked file, so the run would push nothing and
          # still report success.
          git add docs/benchmarks/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # [skip ci] so that committing results does not start the pipeline over again.
          git commit -m "[bot][skip ci] Update benchmark history"
          branch="${{ github.event.repository.default_branch }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: Upload the raw reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-history-${{ github.run_id }}
          path: ${{ env.RUNS }}/
          retention-days: 30
          if-no-files-found: warn
